name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      # The e2e job drives the anonymous flow's GPX hop against a real backend, so a
      # backend change can break this workflow with no frontend diff.
      - 'src/backend/**'
      - '.github/workflows/azure-static-web-apps-purple-sky-08f4fb710.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
      - '.github/workflows/azure-static-web-apps-purple-sky-08f4fb710.yml'

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Frontend Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
        working-directory: src/frontend
      - run: npm test
        working-directory: src/frontend

  e2e:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Anonymous Flow E2E
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      # Playwright starts the .NET backend itself, so the runner needs the SDK.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: npm ci
        working-directory: src/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend
      - run: npx playwright test
        working-directory: src/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  build_and_deploy_job:
    needs: [test, e2e]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # NEXT_PUBLIC_* vars are inlined into the client bundle at build time,
          # so they must reach the SWA action's internal Oryx build step here —
          # setting them only as SWA runtime app settings has no effect on them.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SKY_08F4FB710 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "src/frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SKY_08F4FB710 }}
          action: "close"
