name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet test src/backend/VeloRoute.Tests/VeloRoute.Tests.csproj --configuration Release --verbosity minimal
      - name: Check for pending EF model changes
        working-directory: src/backend
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project VeloRoute/VeloRoute.csproj

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet publish src/backend/VeloRoute/VeloRoute.csproj -c Release -o ./publish
      - name: Build EF migration bundle
        working-directory: src/backend
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --configuration Release --self-contained -r linux-x64 \
            --project VeloRoute/VeloRoute.csproj -o efbundle-output/efbundle
      - name: Apply pending migrations via Kudu
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          # Kudu's /api/command response can embed the connection string
          # inside efbundle's own error output on failure (e.g. an Npgsql
          # auth exception) - that string never goes through secrets.*, so
          # GitHub's log masking can't redact it. Scrub before printing.
          scrub() {
            sed -E \
              -e 's/(Password|Pwd)=[^;]*/\1=***REDACTED***/gi' \
              -e 's#(postgres(ql)?://)[^@[:space:]"]*@#\1***REDACTED***@#gi' \
              "$1"
          }
          USER=$(echo "$AZURE_WEBAPP_PUBLISH_PROFILE" | grep -o 'userName="[^"]*"' | head -1 | cut -d'"' -f2)
          PASS=$(echo "$AZURE_WEBAPP_PUBLISH_PROFILE" | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)

          # If-Match: * is required by Kudu VFS to overwrite a file that
          # already exists (e.g. left over from a prior, failed attempt) -
          # without it, a re-upload gets rejected with 412.
          PUT_STATUS=$(curl -s -o /tmp/kudu-put.txt -w '%{http_code}' -u "$USER:$PASS" \
            -X PUT \
            -H "If-Match: *" \
            --data-binary @src/backend/efbundle-output/efbundle \
            "https://velo-route-api.scm.azurewebsites.net/api/vfs/site/deployments/tools/efbundle")
          echo "VFS PUT status: $PUT_STATUS"
          cat /tmp/kudu-put.txt
          if [ "$PUT_STATUS" -lt 200 ] || [ "$PUT_STATUS" -ge 300 ]; then
            echo "VFS upload failed"
            exit 1
          fi

          # Kudu's /api/command tokenizes "command" itself and does not
          # interpret shell operators or expand env vars - it must be told
          # to spawn a real shell for `&&` and `$ConnectionStrings__Default`
          # to mean anything.
          RAW_COMMAND='/bin/bash -c "chmod +x efbundle && ./efbundle --connection \"$ConnectionStrings__Default\""'
          PAYLOAD=$(jq -n --arg cmd "$RAW_COMMAND" --arg dir "site/deployments/tools" \
            '{command: $cmd, dir: $dir}')

          CMD_STATUS=$(curl -s -o /tmp/kudu-cmd.json -w '%{http_code}' -u "$USER:$PASS" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://velo-route-api.scm.azurewebsites.net/api/command")
          echo "Command POST status: $CMD_STATUS"
          if [ "$CMD_STATUS" -lt 200 ] || [ "$CMD_STATUS" -ge 300 ]; then
            echo "Kudu command request failed"
            scrub /tmp/kudu-cmd.json
            exit 1
          fi
          if ! jq -e '.ExitCode == 0' /tmp/kudu-cmd.json >/dev/null; then
            echo "Migration command failed"
            scrub /tmp/kudu-cmd.json
            exit 1
          fi
          echo "Migration command succeeded (ExitCode 0)"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: velo-route-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
      - name: Post-deploy smoke test
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_SMOKE_TEST_EMAIL: ${{ secrets.CLERK_SMOKE_TEST_EMAIL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          # curl -f fails silently with no body on a non-2xx response, which
          # makes a real failure here undebuggable from the log alone. Print
          # the status and body to stderr before exiting non-zero instead.
          #
          # Also persist cookies across every call: Clerk's Frontend API ties
          # a sign-in attempt to an anonymous "client" via a Set-Cookie on the
          # first request. Without a shared jar, each curl invocation looks
          # like a brand new client and later steps 401 with "signed_out".
          COOKIE_JAR=$(mktemp)
          req() {
            local method="$1" url="$2"; shift 2
            local resp status body
            resp=$(curl -s -c "$COOKIE_JAR" -b "$COOKIE_JAR" -w '\n%{http_code}' -X "$method" "$url" "$@")
            status=$(echo "$resp" | tail -n1)
            body=$(echo "$resp" | sed '$d')
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Request failed: $method $url -> HTTP $status" >&2
              echo "$body" >&2
              return 1
            fi
            echo "$body"
          }

          echo "Checking /health..."
          req GET https://velo-route-api.azurewebsites.net/health > /dev/null

          # The Frontend API domain is base64-encoded inside the publishable
          # key: pk_test_<base64(domain + "$")> - Clerk emits it unpadded,
          # but GNU base64 (this runner) refuses to decode without '='
          # padding to a multiple of 4, unlike a tolerant decoder.
          B64=$(echo "$CLERK_PUBLISHABLE_KEY" | cut -d'_' -f3-)
          case $(( ${#B64} % 4 )) in
            2) B64="${B64}==" ;;
            3) B64="${B64}=" ;;
          esac
          FAPI_DOMAIN=$(echo "$B64" | base64 -d | tr -d '$')
          FAPI="https://$FAPI_DOMAIN"

          # A Testing Token bypasses Clerk's bot detection on scripted Frontend
          # API calls - the same mechanism @clerk/testing uses under the hood
          # for Playwright/Cypress.
          TESTING_TOKEN=$(req POST "https://api.clerk.com/v1/testing_tokens" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" | jq -r '.token // .response.token')

          # Development instances (pk_test_ / *.accounts.dev) additionally
          # require a "dev browser" JWT on every Frontend API call - a real
          # browser gets this transparently from clerk-js, but a raw curl
          # client has to fetch it itself via POST /v1/dev_browser (returns
          # {"id": "<jwt>"}) and attach it as __clerk_db_jwt on every FAPI
          # request from here on, or Frontend API calls 401 with
          # dev_browser_unauthenticated.
          DEV_BROWSER_JWT=$(req POST "$FAPI/v1/dev_browser?__clerk_testing_token=$TESTING_TOKEN" | jq -r '.id // .response.id')
          FAPI_AUTH="__clerk_testing_token=$TESTING_TOKEN&__clerk_db_jwt=$DEV_BROWSER_JWT"

          # Ensure the dedicated smoke-test user exists (idempotent). The
          # "+clerk_test" local-part makes Clerk treat this identity as
          # test-mode regardless of instance type: no real email is sent and
          # the fixed code 424242 always verifies it.
          # -G --data-urlencode percent-encodes the query param - the
          # "+clerk_test" local-part's literal '+' would otherwise be sent as
          # a space, making this check silently miss the existing user and
          # then fail the create call below with a duplicate-email error.
          EXISTING_COUNT=$(req GET "https://api.clerk.com/v1/users" \
            -G --data-urlencode "email_address=$CLERK_SMOKE_TEST_EMAIL" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" | jq 'length')
          if [ "$EXISTING_COUNT" -eq 0 ]; then
            echo "Creating dedicated smoke-test Clerk user..."
            req POST "https://api.clerk.com/v1/users" \
              -H "Authorization: Bearer $CLERK_SECRET_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg email "$CLERK_SMOKE_TEST_EMAIL" \
                '{email_address: [$email], skip_password_requirement: true}')" > /dev/null
          fi

          # Sign-in via the Frontend API: create the attempt, prepare + attempt
          # the email_code first factor with the fixed test code, then exchange
          # the resulting session for a JWT.
          #
          # Clerk stamps the session JWT's "azp" claim from the request's
          # Origin header - it's not settable any other way. The backend
          # rejects any JWT whose azp doesn't match Clerk:AllowedAzp
          # (Program.cs's OnTokenValidated), so every call in this flow must
          # claim to originate from that same configured frontend origin.
          FRONTEND_ORIGIN="https://purple-sky-08f4fb710.7.azurestaticapps.net"

          SIGN_IN=$(req POST "$FAPI/v1/client/sign_ins?$FAPI_AUTH" \
            -H "Origin: $FRONTEND_ORIGIN" \
            --data-urlencode "identifier=$CLERK_SMOKE_TEST_EMAIL")
          SIGN_IN_ID=$(echo "$SIGN_IN" | jq -r '.response.id // .id')
          EMAIL_FACTOR_ID=$(echo "$SIGN_IN" | jq -r \
            '(.response.supported_first_factors // .supported_first_factors)[] | select(.strategy=="email_code") | .email_address_id')

          req POST "$FAPI/v1/client/sign_ins/$SIGN_IN_ID/prepare_first_factor?$FAPI_AUTH" \
            -H "Origin: $FRONTEND_ORIGIN" \
            --data-urlencode "strategy=email_code" \
            --data-urlencode "email_address_id=$EMAIL_FACTOR_ID" > /dev/null

          ATTEMPT=$(req POST "$FAPI/v1/client/sign_ins/$SIGN_IN_ID/attempt_first_factor?$FAPI_AUTH" \
            -H "Origin: $FRONTEND_ORIGIN" \
            --data-urlencode "strategy=email_code" \
            --data-urlencode "code=424242")
          SESSION_ID=$(echo "$ATTEMPT" | jq -r '.response.created_session_id // .created_session_id')

          JWT=$(req POST "$FAPI/v1/client/sessions/$SESSION_ID/tokens?$FAPI_AUTH" \
            -H "Origin: $FRONTEND_ORIGIN" \
            | jq -r '.jwt // .response.jwt')

          echo "Verifying authenticated round-trip..."
          req GET https://velo-route-api.azurewebsites.net/routes -H "Authorization: Bearer $JWT" > /dev/null
          echo "Backend smoke test passed."
